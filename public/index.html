<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Inventario UTEQ - Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-caja">
    <h2>Iniciar sesion</h2>
    <form id="form-login">
      <label for="username">Usuario plis</label>
      <input id="username" name="username" required autocomplete="username" />
      <label for="password">Contraseña plis</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button class="principal" type="submit">Entrar</button>
    </form>
    <p id="mensaje"></p>
  </div>
  <script src="/common.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = '';
      mensaje.className = '';
      const { status, body } = await apiFetch('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      if (status === 200) {
        localStorage.setItem('token', body.data.token);
        localStorage.setItem('usuario', JSON.stringify(body.data.usuario));
        window.location.href = '/productos.html';
      } else {
        mensaje.textContent = body?.data?.mensaje || 'Error al iniciar sesion';
        mensaje.className = 'error';
      }
    });
  </script>
</body>
</html>
