<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Inventario UTEQ - Productos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="barra"></div>
  <div class="contenedor">
    <h2>Productos</h2>
    <form id="form-categoria" class="inline">
      <input id="cat-nombre" placeholder="Nueva categoria" required />
      <button class="principal" type="submit">Agregar categoria</button>
    </form>

    <form id="form-producto" class="inline">
      <input id="prod-nombre" placeholder="Nombre del producto" required />
      <input id="prod-precio" placeholder="Precio" type="number" step="0.01" required />
      <input id="prod-stock" placeholder="Stock" type="number" />
      <select id="prod-categoria" required></select>
      <button class="principal" type="submit">Agregar producto</button>
    </form>
    <p id="mensaje"></p>

    <table id="tabla-productos">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoria</th><th>Acciones</th></tr>
      </thead>
      <tbody id="cuerpo-productos"></tbody>
    </table>
  </div>

  <script src="/common.js"></script>
  <script>
    exigirSesion();
    montarBarra('productos');

    async function cargarCategorias() {
      const { body } = await apiFetch('/api/categorias');
      const select = document.getElementById('prod-categoria');
      select.innerHTML = body.data.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      return body.data;
    }

    async function cargarProductos() {
      const { body } = await apiFetch('/api/productos');
      const cuerpo = document.getElementById('cuerpo-productos');
      cuerpo.innerHTML = body.data.map(p => `
        <tr data-id="${p.id}">
          <td>${p.id}</td><td>${p.nombre}</td><td>${p.precio}</td><td>${p.stock}</td><td>${p.categoria_nombre}</td>
          <td><button class="btn-eliminar" data-id="${p.id}">Eliminar</button></td>
        </tr>`).join('');
      cuerpo.querySelectorAll('.btn-eliminar').forEach(btn => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/api/productos/${btn.dataset.id}`, { method: 'DELETE' });
          cargarProductos();
        });
      });
    }

    document.getElementById('form-categoria').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('cat-nombre').value.trim();
      const { status, body } = await apiFetch('/api/categorias', { method: 'POST', body: JSON.stringify({ nombre }) });
      const mensaje = document.getElementById('mensaje');
      if (status === 201) {
        mensaje.textContent = 'Categoria creada'; mensaje.className = 'ok';
        document.getElementById('cat-nombre').value = '';
        cargarCategorias();
      } else {
        mensaje.textContent = body?.data?.mensaje || 'Error'; mensaje.className = 'error';
      }
    });

    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('prod-nombre').value.trim();
      const precio = parseFloat(document.getElementById('prod-precio').value);
      const stock = parseInt(document.getElementById('prod-stock').value || '0', 10);
      const categoria_id = parseInt(document.getElementById('prod-categoria').value, 10);
      const { status, body } = await apiFetch('/api/productos', {
        method: 'POST',
        body: JSON.stringify({ nombre, precio, stock, categoria_id }),
      });
      const mensaje = document.getElementById('mensaje');
      if (status === 201) {
        mensaje.textContent = 'Producto creado'; mensaje.className = 'ok';
        document.getElementById('prod-nombre').value = '';
        document.getElementById('prod-precio').value = '';
        document.getElementById('prod-stock').value = '';
        cargarProductos();
      } else {
        mensaje.textContent = body?.data?.mensaje || 'Error'; mensaje.className = 'error';
      }
    });

    cargarCategorias().then(cargarProductos);
  </script>
</body>
</html>
